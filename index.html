<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Greenlab App</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="gsFrame"></iframe>
  <script>
    // Cache-buster: har baar page load pe naya query param add karo,
    // taki mobile Chrome purani cached copy ke bajaye Apps Script se
    // fresh (latest deployed) version laaye.
    var baseUrl = "https://script.google.com/macros/s/AKfycbzCTg1w5CTB2UZZncY6sojUUlCW4nM2ZjGmpt-V5QmSXirKzzeLqR9O3FERf8d_e8c/exec";
    document.getElementById('gsFrame').src = baseUrl + "?nocache=" + Date.now();
  </script>
</body>
</html>
